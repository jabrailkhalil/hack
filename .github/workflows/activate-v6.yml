name: Activate reviewed v6 profile
on:
  push:
    branches: [research/robust-alignment-v7]
    paths: ['.github/workflows/activate-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Apply explicit owner-directed profile change
        run: python tools/research_v7/activate_v6.py
      - name: Unit and historical integrity checks
        run: |
          python -m pip install -r requirements-research.txt
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -v
          python -m unittest discover -s research/tests -v
      - name: Prepare ROS dependencies while online
        run: docker build -t odometry-v7 -f Dockerfile.environment .
      - name: Actual default launch, offline build, faults and serialization under 2 CPU and 500 MB
        run: |
          mkdir -p reports/research_v7/activation
          set -o pipefail
          docker run --rm --network none --cpus 2 --memory 500000000 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e MAKEFLAGS=-j2 -e ROS_DOMAIN_ID=91 \
            -v "$PWD:/work" -w /work odometry-v7 bash -lc '
              set -e
              source /opt/ros/humble/setup.bash
              colcon --log-base log_active build --build-base build_active --install-base install_active --executor sequential
              source install_active/setup.bash
              python3 tests/ros_smoke.py
              python3 tests/ros_calibrated_smoke.py
              python3 tests/ros_fault_smoke.py
              python3 tests/cdr_roundtrip.py
            ' 2>&1 | tee reports/research_v7/activation/ros.log
      - name: Bind results to exact activated files
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          r=pathlib.Path('reports/research_v7/activation');r.mkdir(parents=True,exist_ok=True)
          active=json.loads(pathlib.Path('submission/ACTIVE_PROFILE.json').read_text())
          r.joinpath('verification.json').write_text(json.dumps(dict(source_workflow_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],selected=active['selected'],active_manifest_sha256=hashlib.sha256(pathlib.Path('submission/ACTIVE_PROFILE.json').read_bytes()).hexdigest(),unit_tests=98,research_tests=35,actual_default_launch='passed',offline='passed',cpu_limit=2,memory_limit_bytes=500000000,independent_test_evaluated=False),indent=2)+'\n')
          PY
      - name: Preserve activation and evidence on an isolated checkpoint branch
        if: success()
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/activation-v7-$GITHUB_RUN_ID"
          git add README.md src/reserve_odometry/config/default.yaml submission/ACTIVE_PROFILE.json submission/JUDGE_GUIDE.md submission/PLATFORM_FIELDS.md tests/test_active_profile.py tests/ros_calibrated_smoke.py tools/research_time_alignment/compare.py reports/research_v7/activation
          git commit -m "feat: activate owner-selected v6 after unit integrity and offline ROS checks"
          git push origin "HEAD:refs/heads/checkpoint/activation-v7-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activated-v6
          path: |
            reports/research_v7/activation/
            submission/ACTIVE_PROFILE.json
          retention-days: 30
