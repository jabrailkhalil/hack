name: Frozen residual070 release preflight
on:
  push:
    branches: [release/v8-residual070-20260927]
    paths: ['.github/workflows/v8-residual070-release-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Export exact source before measurement access
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          git archive --format=zip --output="$RUNNER_TEMP/handoff/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/handoff/source-commit.txt"
      - name: Check frozen code and test validation gates
        run: |
          python -m pip install -r requirements-research.txt PyYAML==6.0.2
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s research/v8_release -p 'test_*.py' -v
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s research/v8_targeted -p 'test_*.py' -v
      - name: Extract validation only and preserve transport receipt
        run: |
          python research/v8_release/prepare.py --archive "$RUNNER_TEMP/dataset.zip" --output "$RUNNER_TEMP/validation-inputs"
          cd "$RUNNER_TEMP/validation-inputs"
          zip -q -r "$RUNNER_TEMP/handoff/validation-only.zip" data RECEIPT.json COLCON_IGNORE
      - name: Frozen paired validation, original/full faults and supplemental suites
        run: |
          set -o pipefail
          python research/v8_release/validate.py --data-root "$RUNNER_TEMP/validation-inputs/data" --output "$RUNNER_TEMP/handoff/validation" --workers 2 2>&1 | tee "$RUNNER_TEMP/handoff/validation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual070-release-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff/
          retention-days: 7
          if-no-files-found: error
  selected-installed-ros:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build dependency image before disconnecting network
        run: docker build -t residual070-ros-env -f Dockerfile.environment .
      - name: Verify installed selected profile offline under 2 CPU and 500 MB
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ros-evidence"
          docker run --rm --network none --cpus 2 --memory 500000000 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e MAKEFLAGS=-j2 \
            -v "$PWD:/work" -v "$RUNNER_TEMP/ros-evidence:/evidence" -w /work residual070-ros-env bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              colcon --log-base log_release build --build-base build_release --install-base install_release --executor sequential
              source install_release/setup.bash
              PYTHONPATH=src/reserve_odometry python3 -m unittest discover -s tests -v
              PYTHONPATH=src/reserve_odometry python3 -m unittest discover -s research/v8_targeted -p "test_*.py" -v
              python3 research/v8_release/ros_selected.py --output /evidence/selected
            ' 2>&1 | tee "$RUNNER_TEMP/ros-evidence/output.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual070-installed-ros-${{ github.run_id }}
          path: ${{ runner.temp }}/ros-evidence/
          retention-days: 7
