name: Paired v6 projection experiment
on:
  push:
    branches: [research/observer-v6]
    paths: ['tools/research_v6/compare.py', 'research/patches/v6-projection.patch', '.github/workflows/research-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Prepare existing pinned data and research dependencies
        run: |
          python -m pip install -r requirements-research.txt
          python tools/get_dataset.py
      - name: Apply explicit experimental patch without changing the published runtime
        run: |
          git apply --check research/patches/v6-projection.patch
          git apply research/patches/v6-projection.patch
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -p test_core.py -v
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s research/v6_tests -v
      - name: Paired comparison and per-bag intermediate evidence
        run: python tools/research_v6/compare.py --output reports/research_v6/round1 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-v6-round1
          path: reports/research_v6/round1/
          retention-days: 30
      - name: Preserve reports on isolated checkpoint branch even on failure
        if: always()
        run: |
          set -eu
          git restore src/reserve_odometry/reserve_odometry/core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/observer-v6-$GITHUB_RUN_ID"
          git add reports/research_v6/round1
          git diff --cached --quiet || git commit -m "research: preserve all v6 projection hypotheses and measurements $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/checkpoint/observer-v6-$GITHUB_RUN_ID"
