name: R3 H27 foundation before candidate
on:
  push:
    branches: [research/R3-H27]
    paths: [.github/workflows/r3-h27-foundation.yml]
permissions:
  contents: write
jobs:
  foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src/reserve_odometry
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify exact locally tested source and initialize evidence
        run: |
          OUT="$RUNNER_TEMP/R3-H27-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUT"
          echo "H27_OUT=$OUT" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$OUT/MEASURED_SOURCE_SHA.txt"
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          pins=json.loads(Path('research/R3/H27/SOURCE_SHA256.json').read_text())
          for name,expected in pins.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,actual,expected)
          print('Exact local source hashes verified',len(pins))
          PY
          python -m pip install -r requirements-research.txt
      - name: Actual foundation and legacy integrity tests
        run: |
          set -o pipefail
          python -m compileall -q src research/R3/H27
          python -m unittest discover -s research/R3/H27/tests -v 2>&1 | tee "$H27_OUT/foundation-tests.log"
          python -m unittest discover -s tests -v 2>&1 | tee "$H27_OUT/legacy-tests.log"
          python -m unittest discover -s research/tests -v 2>&1 | tee "$H27_OUT/research-tests.log"
      - name: Extract only train and development, no validation/test payloads
        run: |
          set -o pipefail
          python research/R3/H27/prepare.py 2>&1 | tee "$H27_OUT/data.log"
          cp dataset/H27-extraction.json "$H27_OUT/"
      - name: Fit residual scale on preregistered train groups
        run: |
          set -o pipefail
          python research/R3/H27/probe.py --stage fit --output "$H27_OUT/train" --workers 2 2>&1 | tee "$H27_OUT/train.log"
      - name: Publish fixed train threshold before development IO
        run: |
          set -eu
          cp "$H27_OUT/train/SCALE.json" research/R3/H27/TRAIN_SCALE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/R3/H27/TRAIN_SCALE.json
          git commit -m "research(R3-H27): freeze train-only threshold before foundation development"
          git push origin HEAD:refs/heads/research/R3-H27
          git rev-parse HEAD > "$H27_OUT/TRAIN_SCALE_COMMIT.txt"
      - name: Natural and original-fault foundation, no intervention or validation
        run: |
          set -o pipefail
          python research/R3/H27/probe.py --stage probe --scale research/R3/H27/TRAIN_SCALE.json --output "$H27_OUT/foundation" --workers 2 2>&1 | tee "$H27_OUT/foundation.log"
      - name: Source and artifact manifest
        if: always()
        run: |
          test -n "$H27_OUT" || exit 0
          cp -a research/R3/H27 "$H27_OUT/source"
          find "$H27_OUT" -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path(os.environ['H27_OUT'])
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          (root/'ARTIFACT_FILES_SHA256.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R3-H27-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.H27_OUT }}/
          retention-days: 30
      - name: Append-only compact checkpoint; compressed traces stay in artifact
        if: always()
        run: |
          set -eu
          test -n "$H27_OUT" || exit 0
          branch="checkpoint/R3-H27-foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          dest="reports/research_R3/H27/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          export H27_DEST="$dest"
          python - <<'PY'
          import os,shutil
          from pathlib import Path
          src=Path(os.environ['H27_OUT']);dst=Path(os.environ['H27_DEST'])
          for p in src.rglob('*'):
              if p.is_file() and p.suffix in ('.json','.log','.txt') and 'source' not in p.relative_to(src).parts:
                  target=dst/p.relative_to(src);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git diff --cached --quiet || git commit -m "research(R3-H27): preserve foundation $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
