name: R2 H15 pinned source
on:
  push:
    branches: [research/round2-H15]
    paths: [.github/workflows/research-R2-H15-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Export source and allowed historical reports only
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/R2-H15-baseline.zip" 65bba39ed05c781f3f69a65c02f69931152cbfd9 src tools tests research docs requirements-research.txt requirements-dev.txt .github Dockerfile.environment reports/research_v6 reports/research_v5 reports/guarded_time_alignment
      - uses: actions/upload-artifact@v4
        with:
          name: R2-H15-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/R2-H15-baseline.zip
          retention-days: 7
