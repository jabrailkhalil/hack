name: Runtime benchmark v4
on:
  push:
    branches: [feat/final-submission-v4]
    paths: ['.github/workflows/runtime-benchmark-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare dependencies and checksum-pinned development data
        run: |
          python3 tools/get_dataset.py
          docker build -t odometry-final-env -f Dockerfile.environment .
      - name: Offline build and two-clock timing pilot
        run: |
          mkdir -p reports/final
          docker run --rm --network none --cpus 2 --memory 500000000 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e MAKEFLAGS=-j2 -e ROS_DOMAIN_ID=87 \
            -v "$PWD:/work" -w /work odometry-final-env bash -lc '
              set -e
              source /opt/ros/humble/setup.bash
              colcon --log-base log_final build --build-base build_final --install-base install_final --executor sequential
              source install_final/setup.bash
              python3 tests/ros_smoke.py
              python3 tests/ros_calibrated_smoke.py
              python3 tools/finalization/ros_benchmark.py --seconds 60 --clock-mode input_stamp --output reports/final/runtime_pilot_input_stamp.json
              python3 tools/finalization/ros_benchmark.py --seconds 60 --clock-mode ros_clock --output reports/final/runtime_pilot_ros_clock.json
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-v4-pilot
          path: reports/final/runtime_pilot*
          retention-days: 30
      - name: Push pilot checkpoint before the long run
        if: always()
        run: |
          set -eu
          git config --global --add safe.directory "$PWD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/runtime-$GITHUB_RUN_ID-pilot"
          git add reports/final/runtime_pilot*
          git commit -m "test: preserve latency pilot $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/checkpoint/runtime-$GITHUB_RUN_ID-pilot"
      - name: Require measured pilot latency before spending time on the long run
        run: |
          python3 - <<'PY'
          import json
          for mode in ('input_stamp','ros_clock'):
              x=json.load(open('reports/final/runtime_pilot_'+mode+'.json'))
              assert x['latency_observed_within_nominal_and_peak'], x
          PY
      - name: Full real bag at 1x with no internet, 2 CPU and 500000000 bytes
        run: |
          docker run --rm --network none --cpus 2 --memory 500000000 -e ROS_DOMAIN_ID=87 \
            -v "$PWD:/work" -w /work odometry-final-env bash -lc '
              set -e
              source /opt/ros/humble/setup.bash
              source install_final/setup.bash
              python3 tools/finalization/ros_benchmark.py --seconds 0 --clock-mode input_stamp --output reports/final/runtime_full.json
            '
      - name: Record exact run identity
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('reports/final/runtime_execution.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],cpu_limit=2,memory_limit_bytes=500000000,network='none'),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-v4
          path: reports/final/runtime*
          retention-days: 30
      - name: Push all measured reports to a separate checkpoint branch
        if: always()
        run: |
          set -eu
          git switch -c "checkpoint/runtime-$GITHUB_RUN_ID"
          git add reports/final/runtime*
          git commit -m "test: preserve full runtime measurement $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/checkpoint/runtime-$GITHUB_RUN_ID"
