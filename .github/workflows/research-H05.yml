name: H05 frozen reliability-history experiment
on:
  push:
    branches: ['research/parallel-H05']
    paths:
      - 'research/patches/H05-reliability.patch'
      - 'research/H05/FREEZE.json'
      - 'research/H05/profile.yaml'
      - 'research/H05/tests/**'
      - 'tools/research_h05/**'
      - '.github/workflows/research-H05.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-H05-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    if: github.ref == 'refs/heads/research/parallel-H05'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Baseline tests, apply frozen patch, candidate mechanism tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/H05"
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/H05/baseline-unit.log"
          git apply --check research/patches/H05-reliability.patch
          git apply research/patches/H05-reliability.patch
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -p test_core.py -v 2>&1 | tee "$RUNNER_TEMP/H05/patched-core-unit.log"
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -p test_timeline.py -v 2>&1 | tee "$RUNNER_TEMP/H05/patched-timeline-unit.log"
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s research/H05/tests -v 2>&1 | tee "$RUNNER_TEMP/H05/H05-unit.log"
      - name: Pinned research environment and archive; no test evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-research.txt 2>&1 | tee "$RUNNER_TEMP/H05/environment.log"
          python tools/get_dataset.py 2>&1 | tee "$RUNNER_TEMP/H05/dataset.log"
      - name: Three preregistered train bags, vehicle topics only, no fitting
        shell: bash
        run: |
          set -euo pipefail
          python tools/research_h05/run.py --stage train --output "$RUNNER_TEMP/H05/train" 2>&1 | tee "$RUNNER_TEMP/H05/train.log"
      - name: One frozen candidate, unchanged evaluator, all validation bags
        shell: bash
        run: |
          set -euo pipefail
          python tools/research_h05/run.py --stage validation --train-output "$RUNNER_TEMP/H05/train" --output "$RUNNER_TEMP/H05/validation" --workers 2 2>&1 | tee "$RUNNER_TEMP/H05/validation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H05-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/H05/
          retention-days: 30
      - name: Append-only H05 checkpoint, never update source/main branches
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! test -d "$RUNNER_TEMP/H05"; then exit 0; fi
          git restore src/reserve_odometry/reserve_odometry/core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/H05-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          destination="reports/research_H05/runs/H05-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$destination"
          cp -a "$RUNNER_TEMP/H05/." "$destination/"
          git add "$destination"
          git diff --cached --quiet || git commit -m "research(H05): preserve paired evidence $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
