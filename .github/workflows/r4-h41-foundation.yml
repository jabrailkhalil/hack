name: R4-H41 passive foundation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Exact baseline and pinned environment
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/R4-H41
          git fetch --depth=1 origin e3b0c9c039d2953fbfcda51231263d38ef9f1024
          python -m pip install -r requirements-research.txt -r research/R4/H41/requirements-math.txt
          mkdir -p "$RUNNER_TEMP/H41-foundation/logs" "$RUNNER_TEMP/H41-foundation/source"
          cp -a research/R4/H41/. "$RUNNER_TEMP/H41-foundation/source/"
          git rev-parse HEAD > "$RUNNER_TEMP/H41-foundation/DIAGNOSTIC_SOURCE_SHA.txt"
          python research/R4/H41/foundation.py --stage source --output "$RUNNER_TEMP/H41-foundation/SOURCE_RECEIPT.json"
      - name: Unchanged tests and passive diagnostics before data
        run: |
          set -euo pipefail
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/unit.log"
          python -m unittest discover -s research/tests -v 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/integrity.log"
          python -m unittest discover -s research/R4/H41 -p test_foundation.py -v 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/foundation-tests.log"
          python research/R4/H41/math/check.py --output "$RUNNER_TEMP/H41-foundation/algebra.json" 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/algebra.log"
          python -m compileall -q research/R4/H41
      - name: Verified data with train and development members only
        run: |
          set -euo pipefail
          python research/R4/H41/foundation.py --stage data --output dataset 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/data.log"
          cp dataset/extraction.json "$RUNNER_TEMP/H41-foundation/extraction.json"
      - name: Passive train-only foundation; no candidate or validation
        run: |
          set -euo pipefail
          python research/R4/H41/foundation.py --stage foundation --data-root dataset/data --output "$RUNNER_TEMP/H41-foundation/train" 2>&1 | tee "$RUNNER_TEMP/H41-foundation/logs/train.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R4-H41-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/H41-foundation/
          retention-days: 30
      - name: Preserve compact evidence on new own checkpoint branch
        if: always()
        run: |
          set -euo pipefail
          if ! test -f "$RUNNER_TEMP/H41-foundation/train/results.json"; then exit 0; fi
          branch="checkpoint/R4-H41-foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          destination="reports/research_R4/H41/foundation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/H41-foundation/train/results.json" "$destination/results.json"
          cp "$RUNNER_TEMP/H41-foundation/train/access.json" "$destination/access.json"
          cp "$RUNNER_TEMP/H41-foundation/SOURCE_RECEIPT.json" "$destination/SOURCE_RECEIPT.json"
          cp "$RUNNER_TEMP/H41-foundation/extraction.json" "$destination/extraction.json"
          DESTINATION="$destination" python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'H41-foundation/train/episodes.csv.gz'
          target=pathlib.Path(os.environ['DESTINATION'])/'ARTIFACT.json'
          target.write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'retention_days':30,
              'episodes_sha256':hashlib.sha256(p.read_bytes()).hexdigest()},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m "research(R4-H41): preserve passive foundation $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
