name: R3 H30 vehicle-only timing diagnosis
on:
  push:
    branches: [research/R3-H30]
    paths: [.github/workflows/research-r3-h30-diagnose.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Vehicle-only diagnostics (no candidate, no reference)
        run: |
          set -euo pipefail
          OUT="reports/research_R3/H30/diagnosis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT"
          python -m pip install -r requirements-research.txt
          python research/R3/H30/stage_data.py --stage development --journal "$OUT/staging.json"
          python research/R3/H30/diagnose.py --output "$OUT/diagnosis" > "$OUT/diagnose.log" 2>&1
          git config user.name 'R3-H30 checkpoint'
          git config user.email 'r3-h30@users.noreply.github.com'
          git switch -c "checkpoint/R3-H30-diagnosis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git add -f "$OUT"
          git commit -m "research(R3-H30): immutable vehicle-only timing diagnosis"
          git push origin HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R3-H30-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/research_R3/H30/diagnosis-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: error
