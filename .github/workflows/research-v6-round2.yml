name: Paired v6 stale-disturbance experiment
on:
  push:
    branches: [research/observer-v6]
    paths: ['.github/workflows/research-v6-round2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Prepare existing pinned data and research dependencies
        run: |
          python -m pip install -r requirements-research.txt
          python tools/get_dataset.py
      - name: Apply tracked round2 patches only inside the experiment
        run: |
          git apply --check research/patches/v6-round2.patch
          git apply research/patches/v6-round2.patch
          git apply --check research/patches/v6-round2-runner.patch
          git apply research/patches/v6-round2-runner.patch
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -p test_core.py -v
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s research/v6_tests -v
      - name: Last three preregistered hypotheses, unchanged acceptance gates
        run: python tools/research_v6/compare.py --plan research/plan_v6_round2.json --output reports/research_v6/round2 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-v6-round2
          path: reports/research_v6/round2/
          retention-days: 30
      - name: Preserve all results on isolated checkpoint branch
        if: always()
        run: |
          set -eu
          git restore src/reserve_odometry/reserve_odometry/core.py tools/research_v6/compare.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "checkpoint/observer-v6-round2-$GITHUB_RUN_ID"
          git add reports/research_v6/round2
          git diff --cached --quiet || git commit -m "research: preserve final three v6 hypotheses $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/checkpoint/observer-v6-round2-$GITHUB_RUN_ID"
