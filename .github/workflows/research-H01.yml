name: H01 conditional measurement-age research
on:
  push:
    branches: [research/parallel-H01]
    paths: ['research/parallel/H01/RUN']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      H01_EVIDENCE: /tmp/H01-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Behavioral tests, development, published freeze, then validation
        run: bash research/parallel/H01/execute.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H01-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/H01-evidence/
          retention-days: 30
