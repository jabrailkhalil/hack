name: R3 H27 fixed source only
on:
  push:
    branches: [research/R3-H27]
    paths: [.github/workflows/r3-h27-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3b0c9c039d2953fbfcda51231263d38ef9f1024
      - name: Archive code only, not reports or measurements
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/R3-H27-fixed-source.tar.gz" HEAD src tests tools research .github requirements-research.txt requirements-dev.txt Dockerfile.environment
          sha256sum "$RUNNER_TEMP/R3-H27-fixed-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/R3-H27-source-SHA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: R3-H27-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/R3-H27-fixed-source.tar.gz
            ${{ runner.temp }}/R3-H27-source-SHA.txt
          retention-days: 7
