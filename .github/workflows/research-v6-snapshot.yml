name: Research v6 source checkpoint
on:
  push:
    branches: [research/observer-v6]
    paths: ['.github/workflows/research-v6-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot tracked source only
        run: git archive --format=zip --output="$RUNNER_TEMP/current-main-v6.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: current-main-v6
          path: ${{ runner.temp }}/current-main-v6.zip
          retention-days: 7
