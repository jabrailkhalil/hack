name: Paired observer v5 validation
on:
  workflow_dispatch:
  push:
    branches: [research/observer-v5]
    paths:
      - 'tools/research_v5/**'
      - 'research/plan_v5.json'
      - '.github/workflows/research-v5.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -r requirements-research.txt
      - run: python tools/get_dataset.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-dataset
          retention-days: 1
          compression-level: 0
          path: dataset/dataset.zip
      - run: python tools/research_v5/compare.py --output reports/research_v5/round1 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-validation
          path: reports/research_v5/
