name: Tests and ROS Humble
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests without ROS or external Python packages
        run: PYTHONPATH=src/reserve_odometry python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q src tools tests research/tests
  research-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install research test dependencies only (no dataset download)
        run: python -m pip install -r requirements-research.txt
      - name: Check role isolation, source freeze, distance metrics and causality
        run: python -m unittest discover -s research/tests -v
  ros-humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build environment (network allowed only here)
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-colcon-common-extensions ros-humble-diagnostic-msgs ros-humble-nav-msgs ros-humble-std-srvs
      - name: Build both packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --executor sequential --event-handlers console_direct+
      - name: Check adapter, actual calibrated launch and installed-node clock faults
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 tests/ros_smoke.py
          python3 tests/ros_calibrated_smoke.py
          python3 tests/ros_calibrated_smoke.py --params-file install/reserve_odometry/share/reserve_odometry/config/adaptive_v5.yaml --expected-json src/reserve_odometry/config/adaptive_v5.json
          python3 tests/ros_fault_smoke.py
  offline-limited:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Provision dependencies before disconnecting network
        run: docker build -t tram-odometry-env -f Dockerfile.environment .
      - name: Offline build and all ROS checks under 2 CPU / 500 MB limit
        run: |
          docker run --rm --network none --cpus 2 --memory 500000000 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 -e MAKEFLAGS=-j2 \
            -v "$PWD:/work" -w /work tram-odometry-env bash -lc '
              set -e
              source /opt/ros/humble/setup.bash
              colcon --log-base log_offline build --build-base build_offline --install-base install_offline --executor sequential
              source install_offline/setup.bash
              python3 tests/ros_smoke.py
              python3 tests/ros_calibrated_smoke.py
              python3 tests/ros_calibrated_smoke.py --params-file install_offline/reserve_odometry/share/reserve_odometry/config/adaptive_v5.yaml --expected-json src/reserve_odometry/config/adaptive_v5.json
              python3 tests/ros_fault_smoke.py
              python3 tests/cdr_roundtrip.py
            '
