name: H10 joint observer paired research
on:
  push:
    branches: [research/parallel-H10]
    paths: [research/parallel/H10/READY.json]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Initialize isolated evidence directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/h10/logs"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/h10/source_commit.txt"
          cp research/parallel/H10/PLAN.json "$RUNNER_TEMP/h10/PLAN.json"
          cp research/parallel/H10/READY.json "$RUNNER_TEMP/h10/READY.json"
      - name: Prepare pinned research dependencies
        shell: bash
        run: python -m pip install -r requirements-research.txt 2>&1 | tee "$RUNNER_TEMP/h10/logs/dependencies.log"
      - name: Apply opt-in algorithm and check implementation before data access
        shell: bash
        run: |
          git show 984fdf2fc4faf05325249215d6b8541c0e68209a:src/reserve_odometry/reserve_odometry/core.py > "$RUNNER_TEMP/H10-baseline-core.py"
          git apply --check research/parallel/H10/algorithm.patch
          git apply research/parallel/H10/algorithm.patch
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -p test_core.py -v 2>&1 | tee "$RUNNER_TEMP/h10/logs/legacy_core.log"
          H10_BASELINE_CORE="$RUNNER_TEMP/H10-baseline-core.py" python research/parallel/H10/test_joint.py 2>&1 | tee "$RUNNER_TEMP/h10/logs/joint_tests.log"
      - name: Download and verify the existing pinned organizer archive
        shell: bash
        run: python tools/get_dataset.py 2>&1 | tee "$RUNNER_TEMP/h10/logs/dataset.log"
      - name: Restricted train replay without GNSS or parameter fitting
        shell: bash
        run: python research/parallel/H10/run.py --stage train --output "$RUNNER_TEMP/h10/train" 2>&1 | tee "$RUNNER_TEMP/h10/logs/train.log"
      - name: Freeze candidate and evaluator before validation
        shell: bash
        run: python research/parallel/H10/run.py --stage freeze --training "$RUNNER_TEMP/h10/train" --output "$RUNNER_TEMP/h10/FREEZE.json" 2>&1 | tee "$RUNNER_TEMP/h10/logs/freeze.log"
      - name: One paired pass of reused validation with unchanged v6 evaluator
        shell: bash
        run: python research/parallel/H10/run.py --stage validation --freeze "$RUNNER_TEMP/h10/FREEZE.json" --output "$RUNNER_TEMP/h10/validation" --workers 2 2>&1 | tee "$RUNNER_TEMP/h10/logs/validation.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H10-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h10/
          retention-days: 30
      - name: Preserve this H10 run without modifying the research branch or old reports
        if: always()
        shell: bash
        run: |
          set -eu
          git restore src/reserve_odometry/reserve_odometry/core.py
          if ! test -d "$RUNNER_TEMP/h10"; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/research-H10-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          destination="reports/research_parallel/H10/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$destination"
          mkdir -p "$destination"
          cp -a "$RUNNER_TEMP/h10/." "$destination/"
          git add "$destination"
          git commit -m "research(H10): preserve run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$branch"
