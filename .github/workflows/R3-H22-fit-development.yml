name: R3-H22 bounded fit and prospective development
on:
  push:
    branches: [research/R3-H22]
    paths: [.github/workflows/R3-H22-fit-development.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Unique output and original dependencies
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/R3-H22-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$OUT/logs"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python -m pip install -r requirements-research.txt 2>&1 | tee "$OUT/logs/install.txt"
          git show 7ed10fa23dff2bf264edb93652359f9728fdad88:reports/research_R3/H22/diagnosis-36220031909-1/diagnosis.json > "$OUT/premise.json"
      - name: Unchanged baseline and H22 tests before measurements
        run: |
          set -euo pipefail
          PYTHONPATH=src/reserve_odometry python -m unittest discover -s tests -v 2>&1 | tee "$OUT/logs/baseline-tests.txt"
          python -m unittest discover -s research/tests -v 2>&1 | tee "$OUT/logs/integrity-tests.txt"
          python research/R3/H22/test_h22.py 2>&1 | tee "$OUT/logs/H22-tests.txt"
          python -m compileall -q research/R3/H22
      - name: Verified organizer archive
        run: |
          set -euo pipefail
          python tools/get_dataset.py 2>&1 | tee "$OUT/logs/dataset.txt"
      - name: Exactly two train-only fits and fixed train-check selection
        run: |
          set -euo pipefail
          python research/R3/H22/fit.py --premise "$OUT/premise.json" --output "$OUT/train" 2>&1 | tee "$OUT/logs/fit.txt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['OUT']);s=json.loads((out/'train/selection.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RUN_DEVELOPMENT='+str(s['selected'] is not None).lower()+'\n')
          PY
      - name: Publish selected calibration BEFORE development IO
        if: env.RUN_DEVELOPMENT == 'true'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="checkpoint/R3-H22-selection-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          dest="reports/research_R3/H22/selection-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          cp "$OUT/train/selection.json" "$dest/"
          cp "$OUT/train/"*.yaml "$dest/"
          DEST="$dest" python - <<'PY'
          import json,os
          from pathlib import Path
          train=Path(os.environ['OUT'])/'train';models={}
          for name in ['A','B']:
              p=train/(name+'.json')
              if p.exists():
                  m=json.loads(p.read_text());models[name]={k:m[k] for k in ['theta','config','readout','nfev','njev','residual_calls','objective','check_veto','rollout_parity_max_abs']}
          (Path(os.environ['DEST'])/'calibrations.json').write_text(json.dumps(models,indent=2)+'\n')
          PY
          git add "$dest"
          git commit -m "research(R3-H22): freeze train-check choice before development $GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > "$OUT/PREDEVELOPMENT_SELECTION_COMMIT.txt"
          git switch --detach "$GITHUB_SHA"
      - name: Enabled fitted A and B structural checks
        if: env.RUN_DEVELOPMENT == 'true'
        run: |
          set -euo pipefail
          for name in A B; do
            if test -f "$OUT/train/$name.json"; then
              H22_CONFIG="$OUT/train/$name.json" python research/R3/H22/test_h22.py 2>&1 | tee "$OUT/logs/H22-enabled-$name-tests.txt"
            fi
          done
      - name: One preselected full observer on ALL development and v8 safety suites
        if: env.RUN_DEVELOPMENT == 'true'
        run: |
          set -euo pipefail
          python research/R3/H22/evaluation.py --training "$OUT/train" --output "$OUT/development" 2>&1 | tee "$OUT/logs/development.txt"
      - name: Paired CPU step and replay cost after warmup
        if: env.RUN_DEVELOPMENT == 'true'
        run: |
          set -euo pipefail
          python research/R3/H22/benchmark.py --training "$OUT/train" --output "$OUT/benchmark" 2>&1 | tee "$OUT/logs/benchmark.txt"
      - name: Compact checkpoint and compressed raw evidence, NEVER validation
        if: always()
        run: |
          set -eu
          git archive --format=tar.gz "$GITHUB_SHA" research/R3/H22 .github/workflows/R3-H22-fit-development.yml > "$OUT/measured-source.tar.gz"
          if test -f research/R3/H22/manifest.json; then cp research/R3/H22/manifest.json "$OUT/source-manifest.json"; fi
          OUT="$OUT" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          hashes={str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='SHA256.json'}
          (out/'SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
          if test -f "$OUT/development/SUMMARY.json"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            branch="checkpoint/R3-H22-result-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            git switch -c "$branch" "$GITHUB_SHA"
            dest="reports/research_R3/H22/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            mkdir -p "$dest"
            cp "$OUT/development/SUMMARY.json" "$OUT/development/aggregate.csv" "$OUT/development/per_bag.csv" "$OUT/development/per_group.json" "$dest/"
            cp "$OUT/train/selection.json" "$OUT/train/"*.yaml "$OUT/PREDEVELOPMENT_SELECTION_COMMIT.txt" "$OUT/SHA256.json" "$dest/"
            if test -f "$OUT/benchmark/cost.json"; then cp "$OUT/benchmark/cost.json" "$dest/"; fi
            git add "$dest"
            git commit -m "research(R3-H22): preserve actual development verdict without validation $GITHUB_RUN_ID"
            git push origin "HEAD:refs/heads/$branch"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R3-H22-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUT }}/
          retention-days: 30
