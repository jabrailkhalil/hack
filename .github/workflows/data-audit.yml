name: Organizer data audit
on:
  push:
    paths:
      - '.github/workflows/data-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download checksum-verified organizer archive and inspect text only
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request, zipfile
          API = 'https://cloud-api.yandex.net/v1/disk/public/resources'
          KEY = 'https://disk.yandex.ru/d/DdnscmWTBtzkOQ'
          EXPECTED = 'd0b2483e13990edb8219b0d7bbcafc7ed001cce549a4d3af467069b2472e7d52'
          query = urllib.parse.urlencode(dict(public_key=KEY, path='/dataset.zip'))
          with urllib.request.urlopen(API + '/download?' + query, timeout=30) as response:
              link = json.load(response)['href']
          digest = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(link, timeout=60) as response, open('dataset.zip','wb') as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > 300 * 1024 * 1024:
                      raise ValueError('Download exceeds expected size bound')
                  output.write(chunk)
                  digest.update(chunk)
          assert digest.hexdigest() == EXPECTED, 'Dataset SHA256 changed; inspect before use'
          print('VERIFIED_ARCHIVE', total, digest.hexdigest())
          with zipfile.ZipFile('dataset.zip') as archive:
              items = archive.infolist()
              print('ARCHIVE_ENTRIES', len(items))
              for entry in items[:250]:
                  print('FILE', entry.filename, entry.file_size)
              for entry in items:
                  name = entry.filename.lower()
                  if entry.file_size <= 262144 and ('readme' in name or name.endswith(('.msg','.idl','metadata.yaml'))):
                      print('TEXT_BEGIN', entry.filename)
                      print(archive.read(entry).decode('utf-8-sig', errors='replace'))
                      print('TEXT_END', entry.filename)
          PY
